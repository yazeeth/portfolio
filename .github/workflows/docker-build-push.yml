name: Build and Push Portfolio Image

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version (e.g. v1.0.0)"
        required: true
        type: string

env:
  IMAGE_NAME: yazeeth/portfolio
  IMAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_VERSION: ${{ env.IMAGE_VERSION }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/yazeeth/portfolio-gitops.git
          cd portfolio-gitops

          sed -i -E "s|(image:[[:space:]]*yazeeth/portfolio:).*|\\1${IMAGE_VERSION}|" portfolio/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portfolio/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps image change required"
            exit 0
          fi

          git commit -m "Update portfolio image to ${IMAGE_VERSION}"
          git push origin main